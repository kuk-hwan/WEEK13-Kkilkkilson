<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="610" viewBox="0 0 1080 610" role="img" aria-labelledby="title desc">
<title id="title">정적 파일 성능 측정</title>
<desc id="desc">동시 연결 수, Keep-Alive 여부, 작업자 수에 따른 처리량, p95 응답 지연, 실패 건수. 각 지표의 막대는 모든 조건에서 동일 척도를 사용합니다.</desc>
